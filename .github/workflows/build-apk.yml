name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Ami Bachelor Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK for Easy Download
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk AmiBachelor.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AmiBachelor-APK
          path: AmiBachelor.apk
          retention-days: 14

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-apk
          name: Ami Bachelor Android APK (Test Build)
          body: |
            ### 📱 Ami Bachelor Android App (Test Build)
            - Download `AmiBachelor.apk` below and install it directly on your Android phone.
            - Enable "Install from unknown sources" if prompted by Android.
          files: AmiBachelor.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
